<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>UMANG Bhaiya — CBSE Study Tracker</title>
    <meta name="description" content="Offline-first CBSE Class 9 & 10 study tracker with customized stages, datesheet pace calculation, and visual insights." />
    <meta name="theme-color" content="#0b0f19" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Top App Header -->
    <header class="app-header">
      <div class="brand-wrapper" onclick="window.UMANG_APP.switchTab('home')">
        <div class="brand-logo-s">S</div>
        <div class="brand-title" id="headerProfileName">UMANG <span>Bhaiya</span></div>
      </div>

      <div class="header-actions">
        <!-- Profile Selector Dropdown -->
        <div style="position: relative;" id="profileSelectorWrapper">
          <button class="profile-select-btn" onclick="window.UMANG_APP.toggleProfileDropdown()">
            <div class="profile-avatar-badge" id="headerAvatarBadge">S</div>
            <span class="profile-name-text" id="profileSelectorText">Select Profile</span>
            <svg style="width: 14px; height: 14px; color: var(--text-muted); flex-shrink: 0;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
          </button>
          <div class="dropdown-menu" id="profileDropdownMenu"></div>
        </div>

        <!-- Theme Toggle -->
        <button class="theme-toggle-btn" id="themeToggleBtn" onclick="window.UMANG_APP.toggleTheme()" title="Toggle Theme">
          ☀️ Light
        </button>
      </div>
    </header>

    <!-- Main Dynamic Tab Container -->
    <main class="main-container" id="tabContent">
      <!-- Dynamically rendered by app.js -->
    </main>

    <!-- Bottom Fixed Navigation Bar -->
    <nav class="bottom-nav">
      <div class="nav-item active" data-tab="home" onclick="window.UMANG_APP.switchTab('home')">
        <div class="nav-icon">
          <svg style="width: 22px; height: 22px;" fill="currentColor" viewBox="0 0 20 20">
            <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path>
          </svg>
        </div>
        <div>Home</div>
      </div>
      <div class="nav-item" data-tab="chapters" onclick="window.UMANG_APP.switchTab('chapters')">
        <div class="nav-icon">
          <svg style="width: 22px; height: 22px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
          </svg>
        </div>
        <div>Chapters</div>
      </div>
      <div class="nav-item" data-tab="insights" onclick="window.UMANG_APP.switchTab('insights')">
        <div class="nav-icon">
          <svg style="width: 22px; height: 22px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
          </svg>
        </div>
        <div>Insights</div>
      </div>
      <div class="nav-item" data-tab="resources" onclick="window.UMANG_APP.switchTab('resources')">
        <div class="nav-icon">
          <svg style="width: 22px; height: 22px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
          </svg>
        </div>
        <div>Resources</div>
      </div>
      <div class="nav-item" data-tab="settings" onclick="window.UMANG_APP.switchTab('settings')">
        <div class="nav-icon">
          <svg style="width: 22px; height: 22px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
          </svg>
        </div>
        <div>Settings</div>
      </div>
    </nav>

    <!-- Modal Container -->
    <div id="modalContainer"></div>

    <!-- Application Script -->
    <script src="app.js"></script>
  </body>
</html>
